<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complete Rental</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/complete-rental.js" defer></script>
</head>
<body>
<div class="container">
    <h1>Complete Rental</h1>
    <form data-ui="complete-rental-form">
        <label for="bookingId">Select Booking:</label>
        <select id="bookingId" name="bookingId" required>
            <option value="" disabled selected>Loading your bookings...</option>
        </select>
        <br/>
        <button type="submit">Complete Rental</button>
    </form>
    <div data-target="rental-result"></div>

    <br/>
    <a href="index.html">Back to Available Cars</a>
</div>
</body>
</html>
