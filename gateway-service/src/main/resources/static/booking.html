<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Booking</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/booking.js" defer></script>
</head>
<body>
<div class="container">
    <h1>Create Booking</h1>
    <form data-ui="booking-form">
        <label for="carId">Select Car:</label>
        <select id="carId" name="carId" required>
            <option value="" disabled selected>Loading available cars...</option>
        </select>
        <br/>

        <label for="startDate">Start Date:</label>
        <input type="date" id="startDate" name="startDate" required>
        <br/>

        <label for="endDate">End Date:</label>
        <input type="date" id="endDate" name="endDate" required>
        <br/>

        <button type="submit">Create Booking</button>
    </form>
    <div data-target="booking-result"></div>

    <br/>
    <a href="index.html">Back to Available Cars</a>
</div>
</body>
</html>
