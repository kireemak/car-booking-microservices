<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Cars</title>
    <link rel="stylesheet" href="styles.css">
    <script src="js/cars.js" defer></script>
</head>
<body>
<div class="container">
    <h1>All Cars</h1>
    <table id="carsTable">
        <thead>
        <tr>
            <th>ID</th>
            <th>Brand</th>
            <th>Model</th>
            <th>Year</th>
            <th>Rental Price</th>
            <th>Status</th>
        </tr>
        </thead>
        <tbody data-ui="cars-table-body">
        </tbody>
    </table>

    <a href="index.html">Back to Available Cars</a>
</div>

<div data-modal="car-details" class="modal">
    <div class="modal-content">
        <span class="close-button" data-action="close-modal">&times;</span>
        <h2 data-target="modal-title">Car Details</h2>
        <div data-target="modal-details"></div>
        <hr>
        <h3>Reviews</h3>
        <div data-target="modal-reviews"></div>
        <hr>
        <h3>Leave a Review</h3>
        <form data-ui="review-form">
            <input type="hidden" id="reviewCarId" name="carId">
            <label for="rating">Rating (1-5):</label>
            <input type="number" id="rating" name="rating" min="1" max="5" required>
            <label for="comment">Comment:</label>
            <textarea id="comment" name="comment" rows="3" required></textarea>
            <button type="submit">Submit</button>
        </form>
    </div>
</div>
</body>
</html>
